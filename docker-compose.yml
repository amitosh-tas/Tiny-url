
services:
  tinyurl:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: tinyurl

    ports:
      - "3000:3000"

    environment:
      DATABASE_URL: "file:/app/data/dev.db"
      NODE_ENV: production
      APP_URL: https://tiny-aws.duckdns.org

    volumes:
      - tinyurl_data:/app/data

    restart: unless-stopped

volumes:
  tinyurl_data:
